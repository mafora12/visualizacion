<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>La Herencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;700&display=swap">
<style>
/* Escenario fijo 1920×1080 que se escala a la pantalla; todo el color sale de la paleta de la ilustración */
:root {
  --tinta: #2b1e59;        /* morado de los títulos */
  --morado: #6959ab;       /* botón Continuar */
  --aether: #9b7bff;       /* brillo del Aetherium */
  --crema: #fff9ed;        /* fondo de las barras */
  --pista: #ede6d9;        /* riel de las barras */
  --telon: #171127;        /* bandas negras alrededor del escenario */
  --papel: rgba(255,255,255,.95);
  --display: "Quicksand", "Nunito", "Varela Round", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--telon); overflow: hidden; font-family: var(--display); color: var(--tinta); -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #fffed6; }
#shake { position: absolute; inset: 0; will-change: transform, filter; }
#sky, #sky img { position: absolute; inset: 0; width: 1920px; height: 1080px; }
#skyNueva { opacity: 0; }
#world { position: absolute; left: 0; top: 0; will-change: transform; }
.panel { position: absolute; top: 0; height: 1080px; }
.capa, .grupo { position: absolute; display: block; }
.capa { pointer-events: none; user-select: none; -webkit-user-drag: none; }
.titulo, .fecha { position: absolute; margin: 0; font-weight: 700; color: var(--tinta); text-align: left; line-height: 1.22; white-space: nowrap; }
.titulo { font-size: 128px; }
.fecha { font-size: 90px; }
.halo { text-shadow: 0 0 2px #fffbe0, 0 0 6px #fffbe0, 0 0 12px #fffbe0, 0 0 22px rgba(255,251,224,.95), 0 0 40px rgba(255,251,224,.8); }
.izq { text-align: left; }
.ventana { position: absolute; border-radius: 3px; background: #ffe8a6; box-shadow: 0 0 14px 4px rgba(255,214,120,.55); opacity: 0; mix-blend-mode: screen; }
.hoja { position: absolute; width: 26px; height: 13px; border-radius: 60% 0 60% 0; filter: blur(.6px); }
.polvo { position: absolute; border-radius: 50%; background: #8a7a5c; opacity: 0; }
.svgcapa { position: absolute; display: block; overflow: visible; }
.svgcapa svg { display: block; overflow: visible; }

/* Línea de tiempo bajo tierra */
#franja { position: absolute; left: 0; bottom: 0; height: 104px; will-change: transform; }
#franja svg { display: block; overflow: visible; }
.nodo circle.aro { transition: fill .5s ease, r .4s cubic-bezier(.3,1.6,.5,1); }
.nodo .punto { transition: fill .5s ease, opacity .5s ease; }
.nodo text { font: 700 21px var(--display); fill: rgba(255,249,237,.55); transition: fill .5s ease; }
.nodo.on text { fill: #fff9ed; }

#destello { position: absolute; inset: 0; background: #fffbe8; opacity: 0; pointer-events: none; }
#penumbra { position: absolute; inset: 0; opacity: 0; pointer-events: none; }

/* Botón del asteroide */
#punto { position: absolute; width: 0; height: 0; display: none; }
#punto button { position: absolute; left: -48px; top: -48px; width: 96px; height: 96px; border: 0; padding: 0; border-radius: 50%; background: transparent; cursor: pointer; }
#punto .onda { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; border: 4px solid #cbb8ff; opacity: 0; pointer-events: none; }
#punto .nucleo { position: absolute; inset: 8px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #d9ccff 0, #9b7bff 30%, #5a2fd0 68%, #2b1e59 100%); box-shadow: 0 0 34px 12px rgba(146,104,255,.8), 0 0 90px 30px rgba(146,104,255,.35); display: grid; place-items: center; }
#punto button:hover .nucleo, #punto button:focus-visible .nucleo { box-shadow: 0 0 44px 18px rgba(170,135,255,.95), 0 0 110px 40px rgba(146,104,255,.45); }
#punto button:focus-visible { outline: 4px dashed #fff; outline-offset: 10px; }

/* Ventana del gráfico */
#ventana { position: absolute; left: 172px; top: 105px; width: 1618px; height: 914px; border-radius: 22px; background: var(--papel); box-shadow: 0 30px 80px rgba(23,17,39,.35); display: none; overflow: hidden; }
#cerrar { position: absolute; left: 14px; top: 18px; width: 64px; height: 64px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; display: grid; place-items: center; transition: background .2s ease, transform .2s ease; }
#cerrar:hover { background: rgba(43,30,89,.08); transform: rotate(90deg); }
#cerrar:focus-visible, #continuar:focus-visible { outline: 4px dashed var(--morado); outline-offset: 6px; }
#vTitulo { position: absolute; left: 117px; top: 40px; margin: 0; font: 700 84px/1.2 var(--display); color: #000; }
#vSub { position: absolute; left: 119px; top: 176px; margin: 0; font: 400 32px/1.3 var(--display); color: #000; }
#vFuente { position: absolute; left: 155px; top: 812px; width: 1140px; margin: 0; font: 300 26px/1.3 var(--display); color: #000; }
#grafico { position: absolute; left: 0; top: 0; width: 1618px; height: 914px; overflow: visible; pointer-events: none; }
#grafico .fila { pointer-events: auto; }
#cerrar, #continuar { z-index: 2; }
#grafico text { font-family: var(--display); }
.fila { cursor: pointer; }
.fila .relleno { transform-box: fill-box; transform-origin: 0% 50%; transition: transform .35s cubic-bezier(.3,1.5,.5,1), filter .35s ease; }
.fila .etq { transition: font-weight .2s ease; }
#grafico.enfoque .fila { opacity: .32; transition: opacity .3s ease; }
#grafico .fila { transition: opacity .3s ease; }
#grafico.enfoque .fila.activa { opacity: 1; }
.fila.activa .relleno { transform: scaleY(1.32); filter: drop-shadow(0 6px 10px rgba(43,30,89,.35)); }
.fila.activa .etq { font-weight: 700; }
#guia { pointer-events: none; opacity: 0; transition: opacity .25s ease; }
#globo { position: absolute; display: none; padding: 14px 22px 12px; border-radius: 18px; background: var(--tinta); color: #fff; text-align: center; pointer-events: none; box-shadow: 0 14px 30px rgba(43,30,89,.35); }
#globo::after { content: ""; position: absolute; left: calc(50% + var(--flecha, 0px)); bottom: -12px; margin-left: -12px; border: 12px solid transparent; border-top-color: var(--tinta); border-bottom: 0; }
#globo b { display: block; font: 700 46px/1 var(--display); white-space: nowrap; }
#globo b sup { font-size: 28px; vertical-align: 20px; margin-left: 2px; }
#globo span { display: block; margin-top: 6px; font: 500 22px/1.2 var(--display); opacity: .85; white-space: nowrap; }
#continuar { position: absolute; left: 1323px; top: 799px; width: 269px; height: 79px; border: 0; border-radius: 60px; background: var(--morado); color: #fff; font: 700 36px var(--display); display: flex; align-items: center; justify-content: center; gap: 18px; padding: 0 26px 0 18px; cursor: pointer; overflow: hidden; opacity: .45; transition: transform .2s ease, box-shadow .2s ease; }
#continuar[disabled] { cursor: default; }
#continuar:not([disabled]):hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 26px rgba(105,89,171,.5); }
#continuar .brillo { position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-20deg); }

/* Pantalla de inicio */
.capa-ui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; background: rgba(255,254,214,.5); }
.capa-ui h1 { margin: 0; font: 700 170px/1 var(--display); color: var(--tinta); letter-spacing: -2px; }
.capa-ui p { margin: 0; font: 500 40px var(--display); color: var(--tinta); }
.play { position: relative; width: 170px; height: 170px; border: 0; border-radius: 50%; background: var(--morado); cursor: pointer; display: grid; place-items: center; box-shadow: 0 0 0 10px rgba(105,89,171,.25), 0 18px 40px rgba(43,30,89,.35); transition: transform .2s ease; }
.play:hover { transform: scale(1.06); }
.play:focus-visible { outline: 5px dashed var(--tinta); outline-offset: 10px; }

#gira { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--telon); color: #fff9ed; text-align: center; font: 700 22px var(--display); z-index: 5; }
#gira svg { width: 80px; height: 80px; animation: girar 2.4s ease-in-out infinite; }
@keyframes girar { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 820px) { #gira { display: flex; } }
@media (prefers-reduced-motion: reduce) { #gira svg { animation: none; } }

/* ---------- Segunda parte: escenas de cine ---------- */
#cine { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.esc { position: absolute; top: 0; left: -14px; width: 1948px; height: 1080px; overflow: hidden; visibility: hidden; opacity: 0; background: #171127; }
.cam { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
.esc .capa { position: absolute; display: block; }
.esc .grupo { position: absolute; }
.velo { position: absolute; inset: 0; pointer-events: none; }
.ancla { position: absolute; width: 0; height: 0; }
.copo { position: absolute; border-radius: 50%; background: #fff; pointer-events: none; }
.chispa { position: absolute; border-radius: 50%; pointer-events: none; }
#negro { position: absolute; inset: 0; background: #0b0816; opacity: 0; visibility: hidden; pointer-events: none; }
#flash { position: absolute; inset: 0; background: #fffdf2; opacity: 0; pointer-events: none; }
#fin { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; background: #0b0816; color: #fff9ed; opacity: 0; visibility: hidden; text-align: center; }
#fin h2 { margin: 0; font: 700 150px/1 var(--display); letter-spacing: -2px; }
#fin p { margin: 0; font: 500 38px var(--display); opacity: .85; }
#fin button { margin-top: 20px; border: 0; border-radius: 60px; background: var(--morado); color: #fff; font: 700 34px var(--display); padding: 18px 44px; cursor: pointer; pointer-events: auto; }
#fin button:focus-visible { outline: 4px dashed #fff; outline-offset: 6px; }

/* Gráficos de imagen dentro de la ventana */
#graficoImg { position: absolute; left: 0; top: 0; width: 1618px; height: 914px; display: none; }
#graficoImg img { position: absolute; display: block; pointer-events: none; }
#graficoImg .hot { position: absolute; cursor: pointer; border-radius: 14px; background: transparent; border: 0; padding: 0; pointer-events: auto; }
#graficoImg .hot:focus-visible { outline: 3px dashed var(--morado); outline-offset: 4px; }
#anillo { position: absolute; display: none; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; border: 5px solid #6959ab; box-shadow: 0 0 0 6px rgba(105,89,171,.25), 0 0 22px rgba(155,123,255,.8); pointer-events: none; z-index: 3; }
#graficoImg.enfoque img.pz { opacity: .35; transition: opacity .3s ease; }
#graficoImg img.pz { transition: opacity .3s ease, filter .3s ease; }
#graficoImg.enfoque img.pz.activa { opacity: 1; filter: drop-shadow(0 8px 14px rgba(43,30,89,.35)); }
#graficoImg img.pz.solo, #graficoImg.enfoque img.pz.solo { opacity: 0; } /* datos que solo aparecen al resaltar su elemento */
#graficoImg.enfoque img.pz.solo.activa { opacity: 1; filter: none; }
#graficoImg .fx { position: absolute; pointer-events: none; }
</style>

<div id="app">
  <div id="stage" aria-label="La Herencia, línea de tiempo animada">
    <div id="shake">
      <div id="sky"><img id="skyDia" src="assets/capas/A_sky.webp" alt=""><img id="skyNueva" src="assets/capas/N_sky.webp" alt=""></div>
      <div id="world"></div>
      <div id="franja"></div>
    </div>
    <div id="cine"></div>
    <div id="negro"></div>
    <div id="flash"></div>
    <div id="penumbra"></div>
    <div id="destello"></div>

    <div id="punto">
      <span class="onda"></span><span class="onda"></span>
      <button id="botonAsteroide" type="button" aria-label="Ver qué tan grande fue el impacto">
        <span class="nucleo"></span>
      </button>
    </div>

    <div id="ventana" role="dialog" aria-modal="true" aria-labelledby="vTitulo">
      <button id="cerrar" type="button" aria-label="Cerrar y volver al asteroide"><svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><path d="M5 5 31 31M31 5 5 31" stroke="#2b1e59" stroke-width="6" stroke-linecap="round"/></svg></button>
      <h2 id="vTitulo">Qué tan grande fue el impacto</h2>
      <p id="vSub">Energía liberada por el impacto, comparada con otros asteroides. Medido en Mt</p>
      <svg id="grafico" viewBox="0 0 1618 914" aria-label="Gráfico de barras en escala logarítmica"></svg>
      <div id="graficoImg"></div>
      <div id="globo"><b></b><span></span></div>
      <p id="vFuente">Fuente: Registro del Observatorio de Aurel | Gráfico: Museo de antigüedades</p>
      <button id="continuar" type="button" disabled><svg width="34" height="38" viewBox="0 0 34 38" aria-hidden="true"><path d="M4 4 30 19 4 34Z" fill="rgba(255,255,255,.35)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>Continuar</button>
    </div>

    <div id="fin" aria-live="polite"><h2>La Herencia</h2><button id="otraVez" type="button">Ver otra vez</button></div>

    <div id="inicio" class="capa-ui">
      <h1>La Herencia</h1>
      <button class="play" id="play" type="button" aria-label="Comenzar la historia" disabled><svg width="64" height="72" viewBox="0 0 64 72" aria-hidden="true"><path d="M10 6 58 36 10 66Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg></button>
      <p>Comenzar</p>
    </div>

  </div>
  <div id="gira"><svg viewBox="0 0 80 80" aria-hidden="true"><rect x="22" y="8" width="36" height="64" rx="8" fill="none" stroke="#fff9ed" stroke-width="5"/><circle cx="40" cy="62" r="3.5" fill="#fff9ed"/></svg>Gira tu celular para ver la historia</div>
</div>

    const box = mk('div', 'grafico-pop', gImg); Object.assign(box.style, { position: 'absolute', inset: '0' }); const L = {};
    P2.capas.forEach(n => { const r = M[P2.k] && M[P2.k][n]; const i = mk('img', 'pz', box); L[n] = i;
      if (!r) { i._r = [0, 0, 0, 0]; i.style.display = 'none'; return; }
      i.src = SRC(P2.k, n); i.alt = ''; i._r = r; Object.assign(i.style, { left: (r[0] - OX) + 'px', top: (r[1] - OY) + 'px', width: r[2] + 'px', height: r[3] + 'px' }); });
    const F = (x, y, w, h) => { const d = mk('div', 'fx', box); Object.assign(d.style, { left: (x - OX) + 'px', top: (y - OY) + 'px', width: w + 'px', height: h + 'px' }); return d; };
    P2.hots = (P2.hot || []).map((h, i) => { const ls = [].concat(h.l || []); let r = h.r;
      if (!r) { const rs = ls.map(n => L[n] && L[n]._r).filter(Boolean); const x0 = Math.min(...rs.map(q => q[0])), y0 = Math.min(...rs.map(q => q[1])); r = [x0, y0, Math.max(...rs.map(q => q[0] + q[2])) - x0, Math.max(...rs.map(q => q[1] + q[3])) - y0]; }
      const b = mk('button', 'hot', box); b.type = 'button'; b.setAttribute('aria-label', `${h.b}: ${h.s}`);
      Object.assign(b.style, { left: (r[0] - OX) + 'px', top: (r[1] - OY) + 'px', width: r[2] + 'px', height: r[3] + 'px' });
      const on = () => enfocarImg(key, i), off = () => quitarImg(key);
      b.addEventListener('pointerenter', (ev) => { if (ev.pointerType === 'mouse') on(); });
      b.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') off(); });
      b.addEventListener('click', () => b.classList.contains('activa') ? off() : on());
      b.addEventListener('focus', on); b.addEventListener('blur', off);
      (h.ver || []).forEach(n => L[n].classList.add('solo'));
      return { b, r, ls: ls.concat(h.ver || []), h }; });
    P2.dom = box; P2.L = L; P2.F = F; return P2;
  }
  function enfocarImg(key, i) {
    const P2 = POP[key]; if (!P2.listo) return; const H = P2.hots[i];
    P2.dom.classList.add('enfoque'); gImg.classList.add('enfoque');
    Object.entries(P2.L).forEach(([n, img]) => img.classList.toggle('activa', H.ls.includes(n)));
    P2.hots.forEach((q, k) => q.b.classList.toggle('activa', k === i));
    if (H.h.r && H.r[2] <= 60) { Object.assign(anillo.style, { display: 'block', left: (H.r[0] - OX + H.r[2] / 2) + 'px', top: (H.r[1] - OY + H.r[3] / 2) + 'px' }); gsap.fromTo(anillo, { scale: .4, opacity: 0 }, { scale: 1, opacity: 1, duration: .35, ease: 'back.out(2)' }); } else anillo.style.display = 'none';
    globo.querySelector('b').textContent = H.h.b; globo.querySelector('span').textContent = H.h.s;
    colocarGlobo(H.r[0] + H.r[2] / 2 - OX, H.r[1] - OY - 10);
    gsap.fromTo(globo, { xPercent: -50, yPercent: -100, y: 12, opacity: 0, scale: .85, transformOrigin: '50% 100%' }, { xPercent: -50, yPercent: -100, y: 0, opacity: 1, scale: 1, duration: .3, ease: 'back.out(2)' });
  }
  // pone el globo apuntando a (x, y) sin salirse de la ventana ni tapar el título o el subtítulo
  function colocarGlobo(x, y, minIzq = 24) {
    globo.style.display = 'block';
    const w = globo.offsetWidth, h = globo.offsetHeight, M = 24;
    const cx = Math.min(1618 - M - w / 2, Math.max(minIzq + w / 2, M + w / 2, x));
    let abajo = Math.max(y, h + M); // el globo crece hacia arriba desde aquí
    const v = $('#ventana').getBoundingClientRect(), k = v.width / 1618 || 1;
    ['#vTitulo', '#vSub'].forEach(sel => { const r = document.createRange(); r.selectNodeContents($(sel)); const b = r.getBoundingClientRect();
      const l = (b.left - v.left) / k, d = (b.right - v.left) / k, t = (b.top - v.top) / k, f = (b.bottom - v.top) / k;
      if (cx + w / 2 > l && cx - w / 2 < d && abajo - h < f + 10 && abajo > t) abajo = f + 10 + h; });
    globo.style.left = cx + 'px'; globo.style.top = abajo + 'px';
    globo.style.setProperty('--flecha', Math.max(-(w / 2 - 30), Math.min(w / 2 - 30, x - cx)) + 'px');
  }
  function quitarImg(key) { const P2 = POP[key]; if (!P2.dom) return; anillo.style.display = 'none'; gImg.classList.remove('enfoque'); Object.values(P2.L).forEach(img => img.classList.remove('activa')); P2.hots.forEach(q => q.b.classList.remove('activa')); globo.style.display = 'none'; }

  /* ---------- Ventana ---------- */
  let abierta = false, pulsoBoton = null;
  const globo = $('#globo'), guia = $('#guia');
  function construirAnimacion(key) {
    const P2 = POP[key]; const a = gsap.timeline({ paused: true });
    a.fromTo('#vTitulo', { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: .55, ease: 'power3.out' }, .15)
     .fromTo('#vSub', { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: 'power3.out' }, .3)
     .fromTo('#vFuente', { opacity: 0 }, { opacity: 1, duration: .5 }, 1);
    let fin;
    if (P2.svg) fin = P2.anim(a); else { montar(key); fin = P2.anim(a, P2.L, P2.F); }
    a.call(habilitarContinuar, [key], fin);
    return a;
  }
  function habilitarContinuar(key) {
    POP[key].listo = true; const b = $('#continuar'); b.disabled = false;
    gsap.to(b, { opacity: 1, duration: .4 });
    gsap.fromTo(b, { scale: 1 }, { scale: 1.08, duration: .25, yoyo: true, repeat: 1, ease: 'power2.out' });
    pulsoBoton = gsap.fromTo(b, { opacity: 1 }, { opacity: .5, duration: .6, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: .6 });
  }
  function abrirVentana() {
    if (abierta) return; abierta = true;
    const P2 = POP[popKey], v = $('#ventana');
    $('#vTitulo').textContent = P2.t; $('#vSub').textContent = P2.s; $('#vFuente').textContent = P2.f;
    $('#grafico').style.display = P2.svg ? 'block' : 'none'; gImg.style.display = P2.svg ? 'none' : 'block';
    Object.entries(POP).forEach(([k, q]) => { if (q.dom) q.dom.style.display = k === popKey ? 'block' : 'none'; });
    $('#vFuente').style.top = (P2.ftop || 812) + 'px';
    const b = $('#continuar'); b.style.top = (P2.boton || 799) + 'px';
    if (!P2.listo) { if (pulsoBoton) pulsoBoton.kill(); gsap.killTweensOf(b); b.disabled = true; gsap.set(b, { opacity: .45, scale: 1 }); }
    v.style.display = 'block';
    gsap.set(v, { transformOrigin: `${puntoPos.x - 172}px ${puntoPos.y - 105}px` });
    gsap.fromTo(v, { scale: .04, opacity: 0, borderRadius: 400 }, { scale: 1, opacity: 1, borderRadius: 22, duration: .65, ease: 'back.out(1.25)' });
    gsap.to([shakeBox, CINE], { filter: reduce ? 'none' : 'blur(6px) saturate(.85)', duration: .5 });
    gsap.to('#punto', { opacity: 0, duration: .25 });
    if (!P2.anim2) P2.anim2 = construirAnimacion(popKey);
    if (!P2.listo) P2.anim2.restart();
    setTimeout(() => $('#cerrar').focus({ preventScroll: true }), 400);
  }
  function cerrarVentana() {
    if (!abierta) return; abierta = false; quitarEnfoque(); quitarImg(popKey);
    const v = $('#ventana');
    gsap.to([shakeBox, CINE], { filter: 'blur(0px) saturate(1)', duration: .45, clearProps: 'filter' });
    gsap.to(v, { scale: .04, opacity: 0, borderRadius: 400, duration: .45, ease: 'power3.in', onComplete: () => { v.style.display = 'none'; } });
  }
  $('#botonAsteroide').addEventListener('click', abrirVentana);
  $('#cerrar').addEventListener('click', () => { cerrarVentana(); gsap.to('#punto', { opacity: 1, duration: .4, delay: .3 }); setTimeout(() => $('#botonAsteroide').focus({ preventScroll: true }), 500); });
  $('#continuar').addEventListener('click', () => {
    if (!POP[popKey].listo) return;
    if (pulsoBoton) pulsoBoton.kill();
    cerrarVentana(); ocultarPunto();
    gsap.delayedCall(.35, () => tl.play());
  });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && abierta) $('#cerrar').click(); });

  /* hover en las barras del impacto: la barra crece y muestra su potencia de 10 */
  const sup = (e) => { const r = Math.round(e*10)/10; return Number.isInteger(r) ? String(r) : String(r).replace('.', ','); };
  function enfocar(i) {
    if (!POP.impacto.listo) return;
    const d = DATOS[i], x = xDe(d.v), y = filasY[i], e = Math.log10(d.v);
    svg.classList.add('enfoque'); filas2.forEach((f, k) => f.classList.toggle('activa', k === i));
    $('#guiaL').setAttribute('x1', x); $('#guiaL').setAttribute('x2', x); $('#guiaL').setAttribute('y1', y + 22);
    $('#guiaP').setAttribute('cx', x); guia.style.opacity = 1;
    svg.querySelectorAll('.tick').forEach(t2 => t2.style.opacity = Math.abs(+t2.dataset.e - e) < 1.01 ? 1 : .35);
    globo.querySelector('b').innerHTML = `10<sup>${sup(e)}</sup> Mt`;
    globo.querySelector('span').textContent = `${fmt.format(d.v)} megatones`;
    colocarGlobo(x, y - 42, X0 + 8);
    gsap.fromTo(globo, { xPercent: -50, yPercent: -100, y: 12, opacity: 0, scale: .85, transformOrigin: '50% 100%' }, { xPercent: -50, yPercent: -100, y: 0, opacity: 1, scale: 1, duration: .3, ease: 'back.out(2)' });
  }
  function quitarEnfoque() {
    svg.classList.remove('enfoque'); filas2.forEach(f => f.classList.remove('activa'));
    guia.style.opacity = 0; globo.style.display = 'none'; svg.querySelectorAll('.tick').forEach(t2 => t2.style.opacity = '');
  }
  filas2.forEach((f, i) => {
    f.addEventListener('pointermove', (ev) => { if (ev.pointerType === 'mouse' && !f.classList.contains('activa')) enfocar(i); });
    f.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') quitarEnfoque(); });
    f.addEventListener('click', () => f.classList.contains('activa') ? quitarEnfoque() : enfocar(i));
    f.addEventListener('focus', () => enfocar(i)); f.addEventListener('blur', quitarEnfoque);
    f.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); f.classList.contains('activa') ? quitarEnfoque() : enfocar(i); } });
  });

  render();
  window.laHerencia = { tl, cam, render, POP, musica, T: Object.assign(T, { choque, TOTAL: tl.duration() }) };
})();
</script>
